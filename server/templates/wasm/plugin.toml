[plugin]
id = "{id}"
name = "{id}"
version = "0.1.0"
description = "What this plugin does, in one sentence"
authors = ["You"]
license = "MIT"
kind = "wasm"
# `make build` copies the module here, next to this file (`pcds plugin install .` and `pack` take it from here).
entry = "plugin.wasm"
abi = 1
# Ask for what you use and nothing more: the admin sees this list and approves it.
capabilities = ["event.chat", "chat.say"]

# The budget you ask for; the server has maxima, and the admin may lower them.
[budget]
fuel_per_event = 500000

# Chat commands: !hello in the chat is delivered to this plugin.
[[command]]
name = "hello"
help = "says hello"
# usage = "[name]"      how it is typed: the player is told when they get it wrong
# max_args = 1
# permission = "operator"   only the players in access.operators may use it

# Settings the admin gives you (pcds plugin config set {id} greeting "Hi"). Read them with host.config("greeting").
[[config]]
key = "greeting"
description = "the word the plugin greets with"
type = "string"
secret = false
default = "Hello"
max_len = 40
