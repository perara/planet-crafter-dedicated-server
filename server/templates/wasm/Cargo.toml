[package]
name = "{crate}"
version = "0.1.0"
edition = "2024"
publish = false

# Its own build, not part of any other workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
pcds-plugin-api = { {api} }

# `cargo test` runs your plugin on this computer against a mock server (pcds_plugin_api::testing).
[dev-dependencies]
pcds-plugin-api = { {api}, features = ["testing"] }

# A small module: size first, no unwinding (a panic becomes a trap the server counts as a fault).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
