# Coverage-guided fuzzing of the parsers (cargo install cargo-fuzz; see fuzz/README below).
#
# The server is one binary crate, so the fuzz binary is that same main.rs compiled with
# --cfg fuzzing: main.rs then has no `main` and pulls in fuzz/entry.rs, which dispatches on the
# environment variable PCDS_FUZZ_TARGET to the `fuzz` module a source file includes from
# fuzz/targets/ (also only under cfg(fuzzing)). Nothing changes in a normal build.
#
#   cd server
#   PCDS_FUZZ_TARGET=wire cargo fuzz run pcds_fuzz fuzz/corpus/wire
#
# Targets: wire utp rpcspec transform ipc config chathooks updater access rules save handoff game front,
# and (round 3, docs/audits.md) oldsave savelayout manifest pluginnet pluginsign wasmhost bincodec
# adminhttp adminroutes names msg toxic loadsave twin tessera.
# oldsave: an old-layout save through the import. savelayout: the loader's layout checks and the
# writer. manifest: plugin.toml, a data plugin's rules and the JSON files beside the plugins (first byte
# picks). pluginnet: allow-list patterns, URLs, redirects, the request a plugin encodes, and which
# addresses may be dialled (against a reference). pluginsign: plugin.sig and the keys. wasmhost: a module
# made from the input calls every host function with edge pointers. bincodec: the snapshot codec on
# its own. adminhttp: the HTTP reader on a socket. adminroutes: the bank's admin routes with hostile
# bodies on a game with the example plugins. names: world names. msg: the front/bank messages. toxic:
# the toxic areas' keys. loadsave: a save damaged one field at a time, loaded. twin: a game and the
# game restored from its snapshot given the same inputs for 1000 ticks send the same bytes. tessera:
# the wreck solver on seeds (PCDS_FUZZ_SAVE=a save of this server is the base of game, twin, loadsave).
# Sweeps (one run each, no libFuzzer input): handoffsweep and savesweep put awkward numbers and strings
# in a real snapshot / save, one value at a time (PCDS_FUZZ_SWEEP_FILE, _STEP, _OFFSET; pass -timeout=0).
# game runs 40 inputs on one Game, takes a snapshot and restores it every 20 (a NaN fails there), and
# writes the inputs of a crash to history-<pid>.bin beside PCDS_FUZZ_LOG (PCDS_FUZZ_REPLAY, PCDS_FUZZ_TRACE).
# Build for what production runs: RUSTFLAGS="-C overflow-checks=off -C debug-assertions=off" (cargo fuzz
# turns them on, which also finds wrapping arithmetic).
# Targets that need the game's tables read them from PCDS_FUZZ_DATA (a tables directory).
[package]
name = "pcds-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ctrlc = { version = "3.5.2", features = ["termination"] }
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
pcds-plugin-api = { path = "../../plugin-api", features = ["std"] }
ring = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
steamworks = "0.13.1"
unicode-normalization = { version = "0.1.25", default-features = false, features = ["std"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
wat = "1"
# portable-dispatch: the default dispatch relies on the compiler turning calls into jumps, which
# AddressSanitizer's instrumentation prevents (a loop of the module overflows the native stack).
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate", "portable-dispatch"] }
xxhash-rust = { version = "0.8.19", features = ["xxh32", "xxh64"] }

[[bin]]
name = "pcds_fuzz"
path = "../src/main.rs"
test = false
doc = false
bench = false

[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)', 'cfg(pcds_corpus)'] }
