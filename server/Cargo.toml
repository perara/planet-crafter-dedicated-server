[package]
name = "pcds-server"
version = "0.1.0"
edition = "2024"
description = "A dedicated server for The Planet Crafter: the game's host side, without the game"
license = "GPL-3.0-or-later"
repository = "https://github.com/perara/planet-crafter-dedicated-server"
publish = false

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
indexmap = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
steamworks = "0.13.1"
xxhash-rust = { version = "0.8.19", features = ["xxh64"] }
