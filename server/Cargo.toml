[package]
name = "pcds-server"
version = "0.6.2"
edition = "2024"
# Edition 2024 and let chains (1.88); clippy::incompatible_msrv checks the std APIs against it.
rust-version = "1.88"
description = "A dedicated server for The Planet Crafter: the game's host side, without the game"
license = "GPL-3.0-or-later"
repository = "https://github.com/perara/planet-crafter-dedicated-server"
publish = false

# One program: the server (pcds serve) and the command line that installs and runs it.
[[bin]]
name = "pcds"
path = "src/main.rs"

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
# ring is rustls' own crypto (no new crate): HMAC-SHA256 for signed chat webhooks.
ring = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
steamworks = "0.13.1"
# Chat webhooks over HTTP and HTTPS (rustls with ring, Mozilla's roots; no OpenSSL).
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
xxhash-rust = { version = "0.8.19", features = ["xxh32", "xxh64"] }
