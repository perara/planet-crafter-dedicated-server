[package]
name = "pcds-server"
version = "0.6.2"
edition = "2024"
# Edition 2024 and let chains (1.88); clippy::incompatible_msrv checks the std APIs against it.
rust-version = "1.88"
description = "A dedicated server for The Planet Crafter: the game's host side, without the game"
license = "GPL-3.0-or-later"
repository = "https://github.com/perara/planet-crafter-dedicated-server"
publish = false

# One program: the server (pcds serve) and the command line that installs and runs it.
[[bin]]
name = "pcds"
path = "src/main.rs"

# fuzz/ builds this crate with --cfg fuzzing (see fuzz/Cargo.toml).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)', 'cfg(pcds_corpus)'] }

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
# The plugin API (docs/plugins-api.md): the events and answers the server writes and a plugin reads.
pcds-plugin-api = { path = "../plugin-api", features = ["std"] }
# ring is rustls' own crypto (no new crate): HMAC-SHA256 for signed chat webhooks.
ring = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
steamworks = "0.13.1"
# plugin.toml and rules.toml: written by hand, so with comments (no default features: parser and serde only).
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
# Chat webhooks over HTTP and HTTPS (rustls with ring, Mozilla's roots; no OpenSSL).
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
# The plugin host's WebAssembly interpreter: pure Rust, fuel metering, no JIT (docs/plugins.md).
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate"] }
xxhash-rust = { version = "0.8.19", features = ["xxh32", "xxh64"] }

[dev-dependencies]
# Writes the hostile plugins of the host's tests as text.
wat = "1"
