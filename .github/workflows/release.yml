name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
        working-directory: server
      - run: cargo test --release --locked
        working-directory: server
      - name: Package
        run: |
          name="pcds-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir -p "dist/$name/bin" "dist/$name/web"
          lib="$(ls -t server/target/release/build/steamworks-sys-*/out/libsteam_api.so | head -1)"
          cp server/target/release/pcds-server "$lib" extractor/prebuilt/PcdsExtractor.dll "dist/$name/bin/"
          cp server/web/index.html "dist/$name/web/"
          cp pcds README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
