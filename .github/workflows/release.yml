name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # A hot update from the last release into this build: that release runs a world with one of
  # every building and players, and this build takes it over (tools/flip-gate.sh). The first
  # update users made (0.6.0 to 0.6.1) failed on a snapshot field the release before did not
  # write, which no test of this build against itself can show. It needs game tables, which
  # are not in the repository: PCDS_TEST_TABLES_URL (a secret) is a .tar.gz of a tables folder
  # (run/data/<game version> of an installed server) the job fetches. Without it the job fails
  # and so does the release: that is the point. To release without it once, set the repository
  # variable PCDS_FLIP_GATE to "off" (the job then only warns), and run `make gate` by hand.
  flip-gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: The gate is skipped on purpose
        if: ${{ vars.PCDS_FLIP_GATE == 'off' }}
        run: echo "::warning::PCDS_FLIP_GATE=off - the hot update from the release before was NOT tested (make gate)"
      - name: Game tables
        if: ${{ vars.PCDS_FLIP_GATE != 'off' }}
        env:
          TABLES_URL: ${{ secrets.PCDS_TEST_TABLES_URL }}
        run: |
          if [ -z "$TABLES_URL" ]; then
            echo "::error::no secret PCDS_TEST_TABLES_URL (a .tar.gz of a game tables folder): the flip from the release before cannot be tested. Set it, or set the variable PCDS_FLIP_GATE to off for this release and run make gate by hand."
            exit 1
          fi
          mkdir "$RUNNER_TEMP/tables"
          curl -fsSL "$TABLES_URL" | tar -xz -C "$RUNNER_TEMP/tables"
          echo "PCDS_TEST_DATA=$RUNNER_TEMP/tables" >> "$GITHUB_ENV"
      - name: The release before, taken over by this build
        if: ${{ vars.PCDS_FLIP_GATE != 'off' }}
        env:
          PCDS_GAME_DIR: none
        run: tools/flip-gate.sh

  linux:
    needs: flip-gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The updater compares release tags with the running program's version: a tag that is not
      # server/Cargo.toml's version would look newer forever (automatic updates would reinstall it).
      - name: The tag is the server's version
        run: test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version = "\(.*\)"/\1/p' server/Cargo.toml | head -1)"
      - run: cargo build --release --locked
        working-directory: server
      # Neither the game tables nor the game are here: the tests that need them skip, by these.
      - run: cargo test --release --locked
        working-directory: server
        env:
          PCDS_TEST_DATA: none
          PCDS_GAME_DIR: none
      # pcds-<tag>-linux-x86_64/: the pcds program with libsteam_api.so and web/ beside it,
      # install.sh, README.md and LICENSE (Makefile, dist).
      - name: Package
        run: make dist VERSION="${GITHUB_REF_NAME}"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true

  # The Docker image of the same tag, only once the release job's tag guard, build and tests
  # have passed.
  image:
    needs: linux
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      # The image is built and tried before it is published: docker/test.sh runs the updater of
      # the image on a read-only root and checks the start without a game. Its second part, the
      # hot update of a running server with players, needs the game's tables, which CI does not
      # have: run it where they are before tagging (make docker-test).
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pcds-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker/test.sh pcds-test
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
