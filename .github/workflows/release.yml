name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
        working-directory: server
      # Neither the game tables nor the game are here: the tests that need them skip, by these.
      - run: cargo test --release --locked
        working-directory: server
        env:
          PCDS_TEST_DATA: none
          PCDS_GAME_DIR: none
      # pcds-<tag>-linux-x86_64/: the pcds program with libsteam_api.so and web/ beside it,
      # install.sh, README.md and LICENSE (Makefile, dist).
      - name: Package
        run: make dist VERSION="${GITHUB_REF_NAME}"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
