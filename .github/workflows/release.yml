name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      # persist-credentials: false: the job's token can write the release, and the build and the tests run the
      # build scripts of every dependency; the token is not left in .git/config for them. The release step
      # below takes it from the job's own context.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      # The updater compares release tags with the running program's version: a tag that is not
      # server/Cargo.toml's version would look newer forever (automatic updates would reinstall it).
      - name: The tag is the server's version
        run: test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version = "\(.*\)"/\1/p' server/Cargo.toml | head -1)"
      - run: cargo build --release --locked
        working-directory: server
      # Neither the game tables nor the game are here: the tests that need them skip, by these.
      - run: cargo test --release --locked
        working-directory: server
        env:
          PCDS_TEST_DATA: none
          PCDS_GAME_DIR: none
      # pcds-<tag>-linux-x86_64/: the pcds program with libsteam_api.so and web/ beside it,
      # install.sh, README.md and LICENSE (Makefile, dist).
      - name: Package
        run: make dist VERSION="${GITHUB_REF_NAME}"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true

  # The Docker image of the same tag, only once the release job's tag guard, build and tests
  # have passed.
  image:
    needs: linux
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      # The image is built and tried before it is published: docker/test.sh runs the updater of
      # the image on a read-only root and checks the start without a game. Its second part, the
      # hot update of a running server with players, needs the game's tables, which CI does not
      # have: run it where they are before tagging (make docker-test), with make gate (the release checklist,
      # docs/hot-update.md).
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: pcds-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker/test.sh pcds-test
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
