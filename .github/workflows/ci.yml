name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: nothing in CI publishes or comments.
permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-20
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - run: cargo build --release --locked
        working-directory: server
      # THIRD_PARTY_LICENSES is what the lock file gives (make licenses).
      - run: python3 scripts/third-party-licenses --check
      # Neither the game tables nor the game are here: the tests that need them skip, by these.
      - run: cargo test --release --locked
        working-directory: server
        env:
          PCDS_TEST_DATA: none
          PCDS_GAME_DIR: none
      # The completeness map agrees with coverage.txt, the sweep matrix and docs/COMPLETENESS.md (no game data).
      - run: python3 tests/parity/completeness/map.py check
        working-directory: server

  # The plugin API crate (no dependencies, builds offline) and the example plugins: the modules are
  # built for WebAssembly, and the Rust one is tested on the PC with a mock host. The committed
  # plugin.wasm files are built by the maintainer's toolchain (scripts/build-plugin-examples
  # --check compares them there, not here: another compiler version may give other bytes).
  plugins:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-20
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - run: cargo test --locked
        working-directory: plugin-api
      - run: cargo test --locked
        working-directory: examples/plugins/hello-stats
      - run: scripts/build-plugin-examples
      - run: python3 examples/plugins/webhook-relay/relay.py --self-test
      - run: cargo test --release --locked --test layers
        working-directory: server

  # The fuzz crate is the server's main.rs built with --cfg fuzzing (server/fuzz/Cargo.toml). Nothing
  # else compiles it, so a change to the server broke it silently once (a dependency feature, two
  # test-only functions): it is type-checked here, as `make fuzz-check` does.
  fuzz:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-20
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server/fuzz
      - run: cargo check --locked --bin pcds_fuzz
        working-directory: server/fuzz
        env:
          RUSTFLAGS: --cfg fuzzing

  script:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck -S error install.sh docker/entrypoint.sh docker/test.sh tools/flip-gate.sh scripts/release-notes
      # The scripts in tools/ are run by hand, never here; they only have to parse.
      - run: for f in tools/*/*.sh; do bash -n "$f"; done
      - run: python3 -m compileall -q tools && find tools -name __pycache__ -prune -exec rm -rf {} +
      # Every section of CHANGELOG.md is dated and has its Breaking changes and Upgrade parts: the
      # release workflow takes the release text from it (docs/hot-update.md, release checklist).
      - run: scripts/release-notes --check
