name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo build --release --locked
        working-directory: server
      # Neither the game tables nor the game are here: the tests that need them skip, by these.
      - run: cargo test --release --locked
        working-directory: server
        env:
          PCDS_TEST_DATA: none
          PCDS_GAME_DIR: none

  script:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S error install.sh docker/entrypoint.sh
