name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes: the token of a run (a pull request's, a dependency's build script's) can read and no more.
permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: server
      - run: cargo build --release --locked
        working-directory: server
      # Neither the game tables nor the game are here: the tests that need them skip, by these.
      - run: cargo test --release --locked
        working-directory: server
        env:
          PCDS_TEST_DATA: none
          PCDS_GAME_DIR: none
      # The completeness map agrees with coverage.txt, the sweep matrix and docs/COMPLETENESS.md (no game data).
      - run: python3 tests/parity/completeness/map.py check
        working-directory: server

  # The plugin API crate (no dependencies, builds offline) and the example plugins: the modules are
  # built for WebAssembly, and the Rust one is tested on the PC with a mock host. The committed
  # plugin.wasm files are built by the maintainer's toolchain (scripts/build-plugin-examples
  # --check compares them there, not here: another compiler version may give other bytes).
  plugins:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - run: cargo test --locked
        working-directory: plugin-api
      - run: cargo test --locked
        working-directory: examples/plugins/hello-stats
      - run: scripts/build-plugin-examples
      - run: python3 examples/plugins/webhook-relay/relay.py --self-test
      - run: cargo test --release --locked --test layers
        working-directory: server

  script:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: shellcheck -S error install.sh docker/entrypoint.sh docker/test.sh tools/flip-gate.sh
      # The scripts in tools/ are run by hand, never here; they only have to parse.
      - run: for f in tools/*/*.sh; do bash -n "$f"; done
      - run: python3 -m compileall -q tools && find tools -name __pycache__ -prune -exec rm -rf {} +
