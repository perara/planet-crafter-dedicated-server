name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      # Tests that need game tables skip themselves here: the tables are not in the repository.
      - run: cargo build --release --locked
        working-directory: server
      - run: cargo test --release --locked
        working-directory: server

  script:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S error install.sh docker/entrypoint.sh
