[plugin]
id = "welcome-rules"
name = "Welcome and rules"
version = "0.1.0"
description = "A welcome message, !rules and !discord, an announcement every 15 minutes, and faster growth while 6 or more play"
authors = ["Planet Crafter dedicated server contributors"]
license = "MIT"
kind = "data"
entry = "rules.toml"
abi = 1
# What rules.toml needs; `pcds plugin check` tells when this list and the file disagree.
capabilities = ["event.chat", "event.player", "event.tick", "world.read", "chat.say", "rules.write"]
