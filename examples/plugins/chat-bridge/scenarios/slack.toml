name = "slack: text payload and no allowed_mentions"

[config]
webhook = "123456/secret-token"
style = "slack"
send_chat = true
send_joins = false

[[player]]
client = 1
name = "Ann & Bo"

[[step]]
chat = { client = 1, text = "<!channel> *hi*" }

[[step]]
note = "a hot update before the first request: the buffer goes through save and load, nothing is lost (a flip after a request panics the runner today)"
flip = true

[[step]]
advance = "1s"
expect = [
  { http = true, contains = "POST https://hooks.slack.com " },
  { http = true, contains = "{\"text\":\"*Ann &amp; Bo*: ‹!channel› ∗hi∗\"}" },
  { http = true, contains = "allowed_mentions", count = 0 },
]
