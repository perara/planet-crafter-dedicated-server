[plugin]
id = "discord-notify"
name = "Discord notify"
version = "0.1.0"
description = "Posts joins, leaves and !report messages to a Discord webhook, five seconds at a time"
authors = ["Planet Crafter dedicated server contributors"]
license = "MIT"
kind = "wasm"
entry = "plugin.wasm"
abi = 1
# net.http is the way out of the sandbox: only to the hosts under [net], approved by you.
capabilities = ["event.player", "event.chat", "event.tick", "chat.say", "net.http"]

[budget]
tick_every_ms = 5000
# One flush builds a message of up to 1900 characters from the lines waiting; with Discord down it does that
# every tick, and a message that size costs more than the default budget (found by the long soak, which
# switched the plugin off for good during a 10 minute outage).
fuel_per_event = 4000000

[events]
subscribe = ["player_join", "player_leave", "tick"]

[[command]]
name = "report"
help = "tell the admins something: !report the door is stuck"

[net]
allow = ["https://discord.com"]
timeout_ms = 10000
max_response_bytes = 4096

# The webhook is a secret: you set it (pcds plugin config set discord-notify webhook), the server
# puts it in the request, and the plugin never sees it.
[[config]]
key = "webhook"
description = "the end of the webhook's URL, ID/TOKEN: https://discord.com/api/webhooks/ID/TOKEN"
secret = true
